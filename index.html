function getFiber(gi) {
  const ti=Math.floor(gi/12), fi=gi%12;
  return { tube:ti, tubeColor:TUBE_COLORS[ti%12], fiberColor:FIBER_COLORS_12[fi], label:`BT${ti+1}-F${fi+1}` };
}
function makeCable(n) { return { name:`Cable ${n}`, direction:"North", size:12, location:"", node:"" }; }
function sk(ci,fi) { return `${ci}:${fi}`; }
function getTubes(cable) {
  return Array.from({length:Math.ceil(cable.size/12)},(_,ti)=>{
    const start=ti*12, count=Math.min(12,cable.size-start);
    return { ti, tubeColor:TUBE_COLORS[ti%12], fibers:Array.from({length:count},(_,fi)=>start+fi) };
  });
}
function ColorDot({ color, size=10 }) {
  return <span style={{display:"inline-block",width:size,height:size,borderRadius:"50%",background:color.hex,border:"0.5px solid rgba(128,128,128,0.4)",flexShrink:0}}/>;
}

const FIBER_COL_W = 28;
const FIBER_ROW_H = 20;
const HDR_H       = 52;
const CAB_GAP     = 20;
const MARGIN      = 12;
const TITLE_H     = 74;
const SHEET_BG    = "#dde2ea";
const NORMALS = { north:{x:0,y:1}, south:{x:0,y:-1}, west:{x:1,y:0}, east:{x:-1,y:0} };

function outlineFor(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.62 ? "#3a4250" : "rgba(255,255,255,0.9)";
}

function hCabW(cab) { return Math.max(80, cab.size * FIBER_COL_W + 16); }
function vCabH(cab) {
  const tubes = getTubes(cab);
  return HDR_H + tubes.reduce((s,{fibers})=>s + fibers.length*FIBER_ROW_H + 4, 0);
}

function computeCanvas(cables) {
  const grouped={North:[],South:[],East:[],West:[]};
  cables.forEach((cab,ci)=>{ (grouped[cab.direction]||grouped.North).push({cab,ci}); });
  const CAB_DEPTH=130, CAB_DEPTH_EW=160;
  const nW = grouped.North.reduce((s,{cab})=>s+hCabW(cab)+CAB_GAP,0)||0;
  const sW = grouped.South.reduce((s,{cab})=>s+hCabW(cab)+CAB_GAP,0)||0;
  const wH = grouped.West.reduce((s,{cab})=>s+vCabH(cab)+CAB_GAP,0)||0;
  const eH = grouped.East.reduce((s,{cab})=>s+vCabH(cab)+CAB_GAP,0)||0;
  const minW = Math.max(nW, sW) + CAB_DEPTH_EW*2 + MARGIN*4 + 160;
  const minH = Math.max(wH, eH) + CAB_DEPTH*2    + MARGIN*4 + 160;
  const W = Math.max(860, minW), H = Math.max(700, minH);
  return {W, H, CAB_DEPTH, CAB_DEPTH_EW};
}

function buildLayouts(cables) {
  const grouped={North:[],South:[],East:[],West:[]};
  cables.forEach((cab,ci)=>{ (grouped[cab.direction]||grouped.North).push({cab,ci}); });
  const {W, H, CAB_DEPTH, CAB_DEPTH_EW} = computeCanvas(cables);
  const all={};
  const nTotalW=grouped.North.reduce((s,{cab})=>s+hCabW(cab)+CAB_GAP,0)-CAB_GAP;
  let nx=(W-nTotalW)/2;
  grouped.North.forEach(({cab,ci})=>{ const w=hCabW(cab); all[ci]={ci,cab,x:nx,y:MARGIN,w,h:CAB_DEPTH,edge:"north"}; nx+=w+CAB_GAP; });
  const sTotalW=grouped.South.reduce((s,{cab})=>s+hCabW(cab)+CAB_GAP,0)-CAB_GAP;
  let sx=(W-sTotalW)/2;
  grouped.South.forEach(({cab,ci})=>{ const w=hCabW(cab); all[ci]={ci,cab,x:sx,y:H-MARGIN-CAB_DEPTH,w,h:CAB_DEPTH,edge:"south"}; sx+=w+CAB_GAP; });
  const wTotalH=grouped.West.reduce((s,{cab})=>s+vCabH(cab)+CAB_GAP,0)-CAB_GAP;
  let wy=(H-wTotalH)/2;
  grouped.West.forEach(({cab,ci})=>{ const h=vCabH(cab); all[ci]={ci,cab,x:MARGIN,y:wy,w:CAB_DEPTH_EW,h,edge:"west"}; wy+=h+CAB_GAP; });
  const eTotalH=grouped.East.reduce((s,{cab})=>s+vCabH(cab)+CAB_GAP,0)-CAB_GAP;
  let ey=(H-eTotalH)/2;
  grouped.East.forEach(({cab,ci})=>{ const h=vCabH(cab); all[ci]={ci,cab,x:W-MARGIN-CAB_DEPTH_EW,y:ey,w:CAB_DEPTH_EW,h,edge:"east"}; ey+=h+CAB_GAP; });
  return {all, W, H};
}

function getFiberPort(layouts, ci, fi) {
  const L=layouts[ci]; if(!L) return null;
  const {x,y,w,h,edge,cab}=L;
  const tubes=getTubes(cab);
  let col=0;
  for(const {fibers} of tubes){
    const idx=fibers.indexOf(fi);
    if(idx>=0){
      if(edge==="north"||edge==="south"){
        const fx=x+8+(col+idx)*FIBER_COL_W+FIBER_COL_W/2;
        return {x:fx, y:edge==="north"?y+h:y};
      } else {
        const fy=y+HDR_H+col*FIBER_ROW_H+idx*FIBER_ROW_H+FIBER_ROW_H/2;
        return {x:edge==="west"?x+w:x, y:fy};
      }
    }
    col+=fibers.length;
  }
  return null;
}

function DiagramTab({ cables, splices, nodeInfo, diagramRef, T }) {
  const [selected, setSelected] = useState(null);
  const [hovered, setHovered] = useState(null);
  const [zoom, setZoom] = useState(1);
  const [zoomInput, setZoomInput] = useState("100");
  const {all: layouts, W: SVG_W, H: SVG_H} = buildLayouts(cables);
  const TOTAL_H = SVG_H + TITLE_H;

  const PRESETS=[0.4,0.6,0.8,1.0,1.25,1.5,2.0];
  const applyZoom=(pct)=>{ const v=Math.min(400,Math.max(10,Math.round(Number(pct)||100))); setZoom(v/100); setZoomInput(String(v)); };
  const setPreset=(z)=>{ setZoom(z); setZoomInput(String(Math.round(z*100))); };
  const nudge=(delta)=>applyZoom(Math.round(zoom*100)+delta);

  const scrollRef = useRef(null);
  const panRef = useRef({active:false, sx:0, sy:0, sl:0, st:0, moved:false});
  const [panning, setPanning] = useState(false);
  const onPanDown=(e)=>{ if(e.button!==0&&e.button!==1) return; const el=scrollRef.current; if(!el) return; panRef.current={active:true, sx:e.clientX, sy:e.clientY, sl:el.scrollLeft, st:el.scrollTop, moved:false}; setPanning(true); };
  const onPanMove=(e)=>{ const p=panRef.current; if(!p.active) return; const el=scrollRef.current; if(!el) return; const dx=e.clientX-p.sx, dy=e.clientY-p.sy; if(!p.moved&&Math.hypot(dx,dy)>4) p.moved=true; if(p.moved){ e.preventDefault(); el.scrollLeft=p.sl-dx; el.scrollTop=p.st-dy; } };
  const endPan=()=>{ if(panRef.current.active){ panRef.current.active=false; setPanning(false); } };
  const onPanClickCapture=(e)=>{ if(panRef.current.moved){ e.stopPropagation(); panRef.current.moved=false; } };

  const spliceCountFor = (ci) => { let n=0; for(const k of Object.keys(splices)) if(Number(k.split(":")[0])===ci) n++; return n; };

  function renderHCable(L) {
    const {ci,cab,x,y,w,h,edge}=L;
    const dirColor=DIR_COLORS[cab.direction]||"#1a56a0";
    const tubes=getTubes(cab);
    const nSpl=spliceCountFor(ci);
    const elems=[];
    elems.push(<rect key="bg" x={x} y={y} width={w} height={h} rx={6} fill="#f0f4f8" stroke={dirColor} strokeWidth={1}/>);
    const hdrY=edge==="north"?y:y+h-HDR_H;
    elems.push(<rect key="hdr" x={x} y={hdrY} width={w} height={HDR_H} rx={5} fill={dirColor}/>);
    elems.push(<text key="hn" x={x+w/2} y={hdrY+19} textAnchor="middle" dominantBaseline="central" style={{fontSize:17,fontWeight:700,fill:"#fff"}}>C{ci+1} – {cab.name}</text>);
    elems.push(<text key="hs" x={x+w/2} y={hdrY+38} textAnchor="middle" dominantBaseline="central" style={{fontSize:13,fontWeight:600,fill:"#e8f1ff"}}>{cab.direction} · {cab.size}F · {nSpl} spliced{cab.location?` · ${cab.location}`:""}</text>);
    const innerY=edge==="north"?y+HDR_H:y;
    const innerH=h-HDR_H;
    const portEdgeY=edge==="north"?y+h:y;
    let col=0;
    tubes.forEach(({ti,tubeColor,fibers})=>{
      const bx=x+8+col*FIBER_COL_W;
      const bw=fibers.length*FIBER_COL_W;
      elems.push(<rect key={`tb${ti}`} x={bx} y={innerY+2} width={bw} height={innerH-4} rx={3} fill={tubeColor.hex} fillOpacity={0.24} stroke={tubeColor.hex} strokeOpacity={0.6} strokeWidth={0.5}/>);
      const btLabelY = edge==="north" ? innerY+11 : innerY+innerH-11;
      elems.push(<text key={`tl${ti}`} x={bx+bw/2} y={btLabelY} textAnchor="middle" dominantBaseline="central" style={{fontSize:10,fill:tubeColor.hex,fontWeight:700}}>BT{ti+1}</text>);
      fibers.forEach((fi,idx)=>{
        const fb=getFiber(fi);
        const cx2=bx+idx*FIBER_COL_W+FIBER_COL_W/2;
        const portY=portEdgeY;
        const dotY=edge==="north"?portY-12:portY+12;
        const dot2Y=edge==="north"?portY-24:portY+24;
        const labelY=edge==="north"?portY-34:portY+34;
        const spliced=!!splices[sk(ci,fi)];
        const isSel=selected&&((selected.ci===ci&&selected.fi===fi)||(splices[sk(selected.ci,selected.fi)]===sk(ci,fi)));
        elems.push(
          <g key={`f${fi}`} onClick={spliced?()=>setSelected(s=>s&&s.ci===ci&&s.fi===fi?null:{ci,fi}):undefined} style={{cursor:spliced?"pointer":"default"}}>
            <line x1={cx2} y1={portY} x2={cx2} y2={edge==="north"?portY-28:portY+28} stroke={fb.fiberColor.hex} strokeWidth={1.2} strokeOpacity={0.6}/>
            <circle cx={cx2} cy={dotY} r={5} fill={fb.fiberColor.hex} stroke={isSel?"#22c55e":outlineFor(fb.fiberColor.hex)} strokeWidth={isSel?2:1}/>
            <circle cx={cx2} cy={dot2Y} r={4} fill={tubeColor.hex} stroke={outlineFor(tubeColor.hex)} strokeWidth={1}/>
            <text x={cx2} y={labelY} textAnchor="middle" dominantBaseline="central" style={{fontSize:9,fill:spliced?"#16a34a":"#555",fontWeight:isSel?700:600}}>{fi+1}</text>
            <text x={cx2} y={edge==="north"?portY-44:portY+44} textAnchor="middle" dominantBaseline="central" style={{fontSize:8,fill:fb.fiberColor.hex,fontWeight:700}}>{fb.fiberColor.name.substring(0,2)}</text>
            {isSel&&<circle cx={cx2} cy={dotY} r={7} fill="none" stroke="#22c55e" strokeWidth={1.5}/>}
          </g>
        );
      });
      col+=fibers.length;
    });
    return <g key={`cab-${ci}`}>{elems}</g>;
  }

  function renderVCable(L) {
    const {ci,cab,x,y,w,h,edge}=L;
    const dirColor=DIR_COLORS[cab.direction]||"#1a56a0";
    const tubes=getTubes(cab);
    const nSpl=spliceCountFor(ci);
    const elems=[];
    elems.push(<rect key="bg" x={x} y={y} width={w} height={h} rx={6} fill="#f0f4f8" stroke={dirColor} strokeWidth={1}/>);
    const hdrX=edge==="west"?x:x+w-HDR_H;
    elems.push(<rect key="hdr" x={hdrX} y={y} width={HDR_H} height={h} rx={5} fill={dirColor}/>);
    elems.push(<text key="ht" x={hdrX+HDR_H/2} y={y+h/2} textAnchor="middle" dominantBaseline="central" transform={`rotate(-90,${hdrX+HDR_H/2},${y+h/2})`} style={{fontSize:15,fontWeight:700,fill:"#fff"}}>C{ci+1} – {cab.name} · {cab.direction} · {nSpl} spliced</text>);
    const portEdgeX=edge==="west"?x+w:x;
    const innerX=edge==="west"?hdrX+HDR_H:x;
    const innerW=w-HDR_H;
    let row=0;
    tubes.forEach(({ti,tubeColor,fibers})=>{
      const ry=y+HDR_H+row*FIBER_ROW_H;
      elems.push(<rect key={`tb${ti}`} x={innerX+2} y={ry} width={innerW-4} height={fibers.length*FIBER_ROW_H} rx={3} fill={tubeColor.hex} fillOpacity={0.24} stroke={tubeColor.hex} strokeOpacity={0.6} strokeWidth={0.5}/>);
      const btLabelX = edge==="west" ? innerX+12 : innerX+innerW-12;
      elems.push(<text key={`tl${ti}`} x={btLabelX} y={ry+fibers.length*FIBER_ROW_H/2} textAnchor="middle" dominantBaseline="central" style={{fontSize:10,fill:tubeColor.hex,fontWeight:700,opacity:0.6}}>BT{ti+1}</text>);
      fibers.forEach((fi,idx)=>{
        const fb=getFiber(fi);
        const fy=ry+idx*FIBER_ROW_H+FIBER_ROW_H/2;
        const spliced=!!splices[sk(ci,fi)];
        const isSel=selected&&((selected.ci===ci&&selected.fi===fi)||(splices[sk(selected.ci,selected.fi)]===sk(ci,fi)));
        const dir=edge==="west"?1:-1;
        const dotX=portEdgeX-dir*10;
        const dot2X=portEdgeX-dir*20;
        const labelX=portEdgeX-dir*30;
        const abbrX=portEdgeX-dir*42;
        elems.push(
          <g key={`f${fi}`} onClick={spliced?()=>setSelected(s=>s&&s.ci===ci&&s.fi===fi?null:{ci,fi}):undefined} style={{cursor:spliced?"pointer":"default"}}>
            <line x1={portEdgeX} y1={fy} x2={portEdgeX-dir*24} y2={fy} stroke={outlineFor(fb.fiberColor.hex)} strokeWidth={2.6} strokeOpacity={0.5}/>
            <line x1={portEdgeX} y1={fy} x2={portEdgeX-dir*24} y2={fy} stroke={fb.fiberColor.hex} strokeWidth={1.4} strokeOpacity={0.95}/>
            <circle cx={dotX} cy={fy} r={5} fill={fb.fiberColor.hex} stroke={isSel?"#22c55e":outlineFor(fb.fiberColor.hex)} strokeWidth={isSel?2:1}/>
            <circle cx={dot2X} cy={fy} r={4} fill={tubeColor.hex} stroke={outlineFor(tubeColor.hex)} strokeWidth={1}/>
            <text x={labelX} y={fy} textAnchor="middle" dominantBaseline="central" style={{fontSize:9,fill:spliced?"#16a34a":"#555",fontWeight:isSel?700:600}}>{fi+1}</text>
            <text x={abbrX} y={fy} textAnchor="middle" dominantBaseline="central" style={{fontSize:8,fill:fb.fiberColor.hex,fontWeight:700}}>{fb.fiberColor.name.substring(0,2)}</text>
            {isSel&&<circle cx={dotX} cy={fy} r={7} fill="none" stroke="#22c55e" strokeWidth={1.5}/>}
          </g>
        );
      });
      row+=fibers.length;
    });
    return <g key={`cab-${ci}`}>{elems}</g>;
  }

  const seen=new Set(), pairs=[];
  for(const [k,v] of Object.entries(splices)){
    if(seen.has(k)||seen.has(v)) continue; seen.add(k); seen.add(v);
    const [aci,afi]=k.split(":").map(Number),[bci,bfi]=v.split(":").map(Number);
    pairs.push({aci,afi,bci,bfi});
  }
  const totalSplices=pairs.length;
  const totalFibers=cables.reduce((s,c)=>s+c.size,0);

  const selKey=selected?sk(selected.ci,selected.fi):null;
  const selDest=selKey?splices[selKey]:null;
  const selDP=selDest?selDest.split(":").map(Number):null;
  let infoPanel=null;
  if(selected&&selDest&&selDP){
    const [dci,dfi]=selDP,afb=getFiber(selected.fi),bfb=getFiber(dfi);
    const cabA=cables[selected.ci],cabB=cables[dci];
    if(cabA&&cabB) infoPanel=(
      <div style={{margin:"0 4px 8px",padding:"8px 12px",borderRadius:8,background:T.spliceBg,border:`1px solid ${T.spliceBorder}`,fontSize:11,display:"flex",flexWrap:"wrap",gap:12,alignItems:"center",color:T.text}}>
        <span style={{fontWeight:600,color:T.spliceText,fontSize:12}}>⚡ Fusion Splice</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:4}}>
          <span style={{width:10,height:10,borderRadius:"50%",background:afb.tubeColor.hex,display:"inline-block"}}/>
          <span style={{width:10,height:10,borderRadius:"50%",background:afb.fiberColor.hex,display:"inline-block"}}/>
          <b>C{selected.ci+1}</b>&nbsp;{cabA.name} ({cabA.direction}) · BT{afb.tube+1} ({afb.tubeColor.name}) · F{selected.fi+1} ({afb.fiberColor.name})
        </span>
        <span style={{color:T.spliceText,fontWeight:600}}>⟷</span>
        <span style={{display:"inline-flex",alignItems:"center",gap:4}}>
          <span style={{width:10,height:10,borderRadius:"50%",background:bfb.tubeColor.hex,display:"inline-block"}}/>
          <span style={{width:10,height:10,borderRadius:"50%",background:bfb.fiberColor.hex,display:"inline-block"}}/>
          <b>C{dci+1}</b>&nbsp;{cabB.name} ({cabB.direction}) · BT{bfb.tube+1} ({bfb.tubeColor.name}) · F{dfi+1} ({bfb.fiberColor.name})
        </span>
        <button onClick={()=>setSelected(null)} style={{marginLeft:"auto",fontSize:10,padding:"2px 8px",borderRadius:4,border:`0.5px solid ${T.spliceBorder}`,background:"transparent",cursor:"pointer",color:T.spliceText}}>Dismiss</button>
      </div>
    );
  }

  const focusActive = hovered!==null || !!selected;
  const tbY = SVG_H;
  const legW = Math.min(330, SVG_W*0.4);
  const midX = legW + 10;
  const rightX = SVG_W - 235;

  return (
    <div>
      {infoPanel}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,color:T.textDim}}>Zoom:</span>
        {PRESETS.map(z=>(
          <button key={z} onClick={()=>setPreset(z)}
            style={{fontSize:10,padding:"2px 8px",borderRadius:4,border:`0.5px solid ${Math.abs(zoom-z)<0.001?"#1a56a0":T.border}`,
              background:Math.abs(zoom-z)<0.001?"#1a56a0":T.btnBg,
              color:Math.abs(zoom-z)<0.001?"#fff":T.text,cursor:"pointer",fontWeight:Math.abs(zoom-z)<0.001?600:400}}>
            {Math.round(z*100)}%
          </button>
        ))}
        <div style={{display:"flex",alignItems:"center",gap:0,marginLeft:6,border:`0.5px solid ${T.border}`,borderRadius:5,overflow:"hidden",background:T.btnBg}}>
          <button onClick={()=>nudge(-5)} title="Zoom out 5%" style={{fontSize:12,lineHeight:1,padding:"3px 8px",border:"none",borderRight:`0.5px solid ${T.border}`,background:"transparent",color:T.text,cursor:"pointer"}}>−</button>
          <input value={zoomInput} onChange={e=>setZoomInput(e.target.value.replace(/[^0-9]/g,""))} onBlur={()=>applyZoom(zoomInput)} onKeyDown={e=>{ if(e.key==="Enter"){ applyZoom(zoomInput); e.currentTarget.blur(); } }} title="Custom zoom 10–400%" style={{width:42,fontSize:10,textAlign:"right",padding:"3px 2px",border:"none",background:"transparent",color:T.text,outline:"none"}}/>
          <span style={{fontSize:10,color:T.textDim,paddingRight:5}}>%</span>
          <button onClick={()=>nudge(5)} title="Zoom in 5%" style={{fontSize:12,lineHeight:1,padding:"3px 8px",border:"none",borderLeft:`0.5px solid ${T.border}`,background:"transparent",color:T.text,cursor:"pointer"}}>+</button>
        </div>
        <button onClick={()=>{ const el=scrollRef.current; if(!el) return; const fit=Math.min((el.clientWidth-16)/SVG_W,(el.clientHeight-16)/TOTAL_H)*100; applyZoom(fit); }} style={{fontSize:10,padding:"3px 9px",borderRadius:5,border:`0.5px solid ${T.border}`,background:T.btnBg,color:T.text,cursor:"pointer"}}>Fit</button>
        <span style={{fontSize:10,color:T.textFaint,marginLeft:4}}>drag to pan · sheet stays white for print</span>
      </div>
      {pairs.length===0&&cables.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:T.textDim,fontSize:13}}>No cables added yet.</div>}
      {pairs.length===0&&cables.length>0&&<div style={{textAlign:"center",padding:"20px 0",color:T.textDim,fontSize:12}}>No splices yet — add splices in the Matrix tab.</div>}
      <div ref={scrollRef}
        onMouseDown={onPanDown} onMouseMove={onPanMove} onMouseUp={endPan} onMouseLeave={endPan} onClickCapture={onPanClickCapture}
        style={{overflowX:"auto",overflowY:"auto",maxHeight:640,border:`0.5px solid ${T.border}`,borderRadius:6,background:SHEET_BG,cursor:panning?"grabbing":"grab",userSelect:"none"}}>
        <div style={{width:SVG_W*zoom, height:TOTAL_H*zoom, position:"relative"}}>
          <svg ref={diagramRef} width={SVG_W} height={TOTAL_H}
            style={{display:"block",background:SHEET_BG,transformOrigin:"top left",transform:`scale(${zoom})`}}>
            <defs>
              <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
                <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#dde3ec" strokeWidth="1"/>
              </pattern>
              <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="180%">
                <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" floodColor="#0d3c7a" floodOpacity="0.35"/>
              </filter>
              <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#2668b8"/>
                <stop offset="100%" stopColor="#153f77"/>
              </linearGradient>
            </defs>
            <style>{`.flowdash{stroke-dasharray:6 10;animation:flowmove 0.9s linear infinite;}@keyframes flowmove{to{stroke-dashoffset:-16;}}`}</style>
            <rect id="canvasBg" x="0" y="0" width={SVG_W} height={SVG_H} fill={SHEET_BG}/>
            <rect x="0" y="0" width={SVG_W} height={SVG_H} fill="url(#grid)"/>

            {Object.values(layouts).map(L=>(L.edge==="north"||L.edge==="south")?renderHCable(L):renderVCable(L))}

            {pairs.map(({aci,afi,bci,bfi},idx)=>{
              const p1=getFiberPort(layouts,aci,afi), p2=getFiberPort(layouts,bci,bfi);
              if(!p1||!p2) return null;
              const ea=layouts[aci]?.edge, eb=layouts[bci]?.edge;
              if(!ea||!eb) return null;
              const colorA=getFiber(afi).fiberColor.hex;
              const colorB=getFiber(bfi).fiberColor.hex;
              const sel=selected&&((selected.ci===aci&&selected.fi===afi)||(selected.ci===bci&&selected.fi===bfi));
              const hov=hovered===idx;
              const isFocus=sel||hov;
              const dim=focusActive&&!isFocus;
              const ns=(e)=>e==="north"||e==="south";
              const R=4;
              const ortho=(pts)=>{
                const P=pts.filter((p,i)=>i===0||Math.abs(p.x-pts[i-1].x)>0.01||Math.abs(p.y-pts[i-1].y)>0.01);
                if(P.length<2) return `M${pts[0].x},${pts[0].y}`;
                let s=`M${P[0].x},${P[0].y}`;
                for(let i=1;i<P.length-1;i++){
                  const a=P[i-1], b=P[i], c=P[i+1];
                  const la=Math.hypot(b.x-a.x,b.y-a.y), lc=Math.hypot(c.x-b.x,c.y-b.y);
                  const uax=(b.x-a.x)/(la||1), uay=(b.y-a.y)/(la||1);
                  const ucx=(c.x-b.x)/(lc||1), ucy=(c.y-b.y)/(lc||1);
                  const r=Math.min(R, la/2, lc/2);
                  s+=` L${b.x-uax*r},${b.y-uay*r}`;
                  s+=` Q${b.x},${b.y} ${b.x+ucx*r},${b.y+ucy*r}`;
                }
                const last=P[P.length-1];
                s+=` L${last.x},${last.y}`;
                return s;
              };
              const lane=((idx*13)%17-8)*4;
              const stub=44;
              const s1={x:p1.x+(ns(ea)?0:(ea==="west"?stub:-stub)), y:p1.y+(ns(ea)?(ea==="north"?stub:-stub):0)};
              const s2={x:p2.x+(ns(eb)?0:(eb==="west"?stub:-stub)), y:p2.y+(ns(eb)?(eb==="north"?stub:-stub):0)};
              const diag=(s,edge,off)=>{
                const a=Math.abs(off);
                if(a<0.5) return [s];
                const dir=Math.sign(off);
                if(ns(edge)){ const stepY=(edge==="north"?1:-1)*a; return [s,{x:s.x+dir*a,y:s.y+stepY}]; }
                else { const stepX=(edge==="west"?1:-1)*a; return [s,{x:s.x+stepX,y:s.y+dir*a}]; }
              };
              let pts;
              if(ns(ea)&&ns(eb)){
                if(Math.abs(p1.x-p2.x)<0.5){ pts=[p1,p2]; }
                else { const midY=(s1.y+s2.y)/2+lane; pts=[p1,s1,{x:s1.x,y:midY},{x:s2.x,y:midY},s2,p2]; }
              } else if(!ns(ea)&&!ns(eb)){
                if(Math.abs(p1.y-p2.y)<0.5){ pts=[p1,p2]; }
                else { const midX=(s1.x+s2.x)/2+lane; pts=[p1,s1,{x:midX,y:s1.y},{x:midX,y:s2.y},s2,p2]; }
              } else {
                if(ns(ea)){ pts=[p1,{x:p1.x,y:p2.y},p2]; }
                else { pts=[p1,{x:p2.x,y:p1.y},p2]; }
              }
              const d=ortho(pts);
              const gradId=`spl-grad-${idx}`;
              const strokeRef=colorA===colorB?colorA:`url(#${gradId})`;
              const midPt=pts[Math.floor(pts.length/2)]||p1;
              const midX2=midPt.x, midY2=midPt.y;
              const tip=`C${aci+1} ${getFiber(afi).label} ⟷ C${bci+1} ${getFiber(bfi).label}`;
              const tScale=1/zoom;
              const tw=tip.length*6.0+20;
              const th=21;
              const halfW=(tw*tScale)/2;
              const tx=Math.min(Math.max(midX2,halfW+4),SVG_W-halfW-4);
              const ty=midY2-14*tScale;
              return(
                <g key={idx}
                  onClick={()=>setSelected(s=>s&&s.ci===aci&&s.fi===afi?null:{ci:aci,fi:afi})}
                  onMouseEnter={()=>setHovered(idx)} onMouseLeave={()=>setHovered(h=>h===idx?null:h)}
                  style={{cursor:"pointer"}}>
                  {colorA!==colorB&&(
                    <linearGradient id={gradId} gradientUnits="userSpaceOnUse" x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}>
                      <stop offset="0%" stopColor={colorA}/>
                      <stop offset="100%" stopColor={colorB}/>
                    </linearGradient>
                  )}
                  <path d={d} fill="none" stroke="transparent" strokeWidth={12}/>
                  {isFocus&&<path d={d} fill="none" stroke={strokeRef} strokeWidth={7} strokeOpacity={0.18} strokeLinecap="round" strokeLinejoin="round"/>}
                  <path d={d} fill="none" stroke={outlineFor(colorA)} strokeWidth={isFocus?4.4:2.6} strokeOpacity={dim?0.05:0.55} strokeLinecap="round" strokeLinejoin="round"/>
                  <path d={d} fill="none" stroke={strokeRef} strokeWidth={isFocus?2.8:1.4} strokeOpacity={dim?0.08:(isFocus?1:0.95)} strokeLinecap="round" strokeLinejoin="round"/>
                  {isFocus&&<path d={d} className="flowdash" fill="none" stroke="#fff" strokeWidth={1.1} strokeOpacity={0.85} strokeLinecap="round" strokeLinejoin="round"/>}
                  <circle cx={p1.x} cy={p1.y} r={isFocus?4.5:2.5} fill={colorA} fillOpacity={dim?0.12:1} stroke={isFocus?"#fff":outlineFor(colorA)} strokeWidth={isFocus?1:0.75}/>
                  <circle cx={p2.x} cy={p2.y} r={isFocus?4.5:2.5} fill={colorB} fillOpacity={dim?0.12:1} stroke={isFocus?"#fff":outlineFor(colorB)} strokeWidth={isFocus?1:0.75}/>
                  {hov&&(
                    <g style={{pointerEvents:"none"}} transform={`translate(${tx},${ty}) scale(${tScale})`}>
                      <rect x={-tw/2} y={-th} width={tw} height={th} rx={6} fill="#0f172a" fillOpacity={0.94} stroke="#ffffff" strokeOpacity={0.25} strokeWidth={0.75}/>
                      <path d={`M-5,0 L5,0 L0,6 Z`} fill="#0f172a" fillOpacity={0.94}/>
                      <text x={0} y={-th/2} textAnchor="middle" dominantBaseline="central" style={{fontSize:11,fill:"#fff",fontWeight:600}}>{tip}</text>
                    </g>
                  )}
                </g>
              );
            })}

            {/* ── Title block (always light for print) ── */}
            <g>
              <rect x={0} y={tbY} width={SVG_W} height={TITLE_H} fill="#f8fafc" stroke="#94a3b8" strokeWidth={1}/>
              <line x1={legW} y1={tbY} x2={legW} y2={tbY+TITLE_H} stroke="#cbd5e1" strokeWidth={1}/>
              <line x1={rightX-10} y1={tbY} x2={rightX-10} y2={tbY+TITLE_H} stroke="#cbd5e1" strokeWidth={1}/>
              <text x={10} y={tbY+13} style={{fontSize:8,fontWeight:700,fill:"#334155",letterSpacing:"0.08em"}}>TIA-598 FIBER / BUFFER TUBE COLOR CODE</text>
              {FIBER_COLORS_12.map((c,i)=>{
                const cxL=12+(i%6)*52, cyL=tbY+27+Math.floor(i/6)*17;
                return(
                  <g key={c.name}>
                    <circle cx={cxL+4} cy={cyL} r={4.5} fill={c.hex} stroke="rgba(0,0,0,0.25)" strokeWidth={0.5}/>
                    <text x={cxL+12} y={cyL} dominantBaseline="central" style={{fontSize:7.5,fill:"#334155"}}>{i+1} {c.name}</text>
                  </g>
                );
              })}
              <text x={12} y={tbY+64} dominantBaseline="central" style={{fontSize:7.5,fontWeight:700,fill:"#334155"}}>DIR:</text>
              {DIRECTIONS.map((dname,i)=>(
                <g key={dname}>
                  <rect x={36+i*66} y={tbY+59} width={10} height={10} rx={2} fill={DIR_COLORS[dname]}/>
                  <text x={50+i*66} y={tbY+64} dominantBaseline="central" style={{fontSize:7.5,fill:"#334155"}}>{dname}</text>
                </g>
              ))}
              {(()=>{
                const bx=midX+6, bw=(rightX-10)-(midX+6)-8, by=tbY+8, bh=TITLE_H-16;
                return (
                  <g>
                    <rect x={bx} y={by} width={bw} height={bh} rx={6} fill="url(#nodeFill)" stroke="#0d3c7a" strokeWidth={1}/>
                    <rect x={bx} y={by} width={bw} height={6} rx={3} fill="#fff" fillOpacity={0.14}/>
                    <text x={bx+12} y={by+13} dominantBaseline="central" style={{fontSize:8,fontWeight:700,fill:"#bcd6f5",letterSpacing:"0.1em"}}>FUSION SPLICE DIAGRAM</text>
                    <text x={bx+12} y={by+28} dominantBaseline="central" style={{fontSize:13,fontWeight:700,fill:"#ffffff"}}>{nodeInfo.node}{nodeInfo.enclosure?`  ·  ${nodeInfo.enclosure}`:""}</text>
                    <text x={bx+12} y={by+42} dominantBaseline="central" style={{fontSize:9,fill:"#dce9fb"}}>{nodeInfo.address||"—"}{nodeInfo.handhole?`   ·   Hand Hole ${nodeInfo.handhole}`:""}</text>
                    <text x={bx+12} y={by+53} dominantBaseline="central" style={{fontSize:8.5,fill:"#a9c7ee"}}>Cables: {cables.length}  ·  Fibers: {totalFibers}  ·  Splices: {totalSplices}</text>
                  </g>
                );
              })()}
              <g transform={`translate(${rightX},${tbY+7}) scale(0.105)`}>
                <LogoGlyphs color="#1a5276"/>
              </g>
              <text x={rightX} y={tbY+59} style={{fontSize:8,fill:"#475569"}}>Date: {new Date().toLocaleDateString()}</text>
              <text x={rightX} y={tbY+69} style={{fontSize:7,fill:"#94a3b8"}}>Generated by Splice Matrix</text>
            </g>
          </svg>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [cables,    setCables]    = useState([makeCable(1), makeCable(2)]);
  const [nodeInfo,  setNodeInfo]  = useState({ node:"Node 1", address:"", handhole:"", enclosure:"Enclosure #1" });
  const [splices,   setSplices]   = useState({});
  const [selecting, setSelecting] = useState(null);
  const [selectingRange, setSelectingRange] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [expandedTubes, setExpandedTubes] = useState({});
  const [exportMsg, setExportMsg] = useState("");
  const [tab, setTab] = useState("matrix");
  const [dark, setDark] = useState(true);
  const [loaded, setLoaded] = useState(false);
  const diagramRef = useRef(null);
  const fileInputRef = useRef(null);
  const T = dark ? THEMES.dark : THEMES.light;
  const DC = T.dirs;

  // ── Load from localStorage on first mount ──
  useEffect(()=>{
    try {
      const raw=localStorage.getItem(STORAGE_KEY);
      if(raw){
        const d=JSON.parse(raw);
        if(d.cables) setCables(d.cables);
        if(d.nodeInfo) setNodeInfo(d.nodeInfo);
        if(d.splices) setSplices(d.splices);
        if(typeof d.dark==="boolean") setDark(d.dark);
      }
    } catch(e){ console.warn("Load failed", e); }
    setLoaded(true);
  },[]);

  // ── Auto-save to localStorage whenever data changes ──
  useEffect(()=>{
    if(!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ v:APP_VERSION, cables, nodeInfo, splices, dark }));
    } catch(e){ console.warn("Save failed", e); }
  },[cables, nodeInfo, splices, dark, loaded]);

  const addCable=()=>{ if(cables.length<MAX_CABLES) setCables(c=>[...c,makeCable(c.length+1)]); };
  const updateCable=useCallback((idx,patch)=>{ setCables(c=>c.map((x,i)=>i===idx?{...x,...patch}:x)); },[]);
  const removeCable=useCallback((idx)=>{
    setSplices(prev=>{ const next={}; for(const [k,v] of Object.entries(prev)){ if(Number(k.split(":")[0])!==idx&&Number(v.split(":")[0])!==idx) next[k]=v; } return next; });
    setCables(c=>c.filter((_,i)=>i!==idx)); setSelecting(null); setSelectingRange(null);
  },[]);

  const handleFiberClick=(ci,fi)=>{
    const key=sk(ci,fi);
    if(selectingRange){
      if(selectingRange.ci===ci){ setSelectingRange(null); return; }
      const allDest=getTubes(cables[ci]).flatMap(({fibers})=>fibers);
      const startIdx=allDest.indexOf(fi);
      if(startIdx===-1) return;
      setSplices(prev=>{
        const next={...prev};
        selectingRange.fibers.forEach((sfi,i)=>{
          const dfi=allDest[startIdx+i];
          if(dfi===undefined) return;
          const sk1=sk(selectingRange.ci,sfi), sk2=sk(ci,dfi);
          if(next[sk1]) delete next[next[sk1]];
          if(next[sk2]) delete next[next[sk2]];
          delete next[sk1]; delete next[sk2];
          next[sk1]=sk2; next[sk2]=sk1;
        });
        return next;
      });
      setSelectingRange(null);
      return;
    }
    if(!selecting){ setSelecting({ci,fi}); return; }
    const srcKey=sk(selecting.ci,selecting.fi);
    if(srcKey===key){ setSelecting(null); return; }
    if(selecting.ci===ci){
      const allFibers=getTubes(cables[ci]).flatMap(({fibers})=>fibers);
      const a=allFibers.indexOf(selecting.fi), b=allFibers.indexOf(fi);
      if(a===-1||b===-1) return;
      const [lo,hi]=a<b?[a,b]:[b,a];
      setSelectingRange({ci, fibers:allFibers.slice(lo,hi+1)});
      setSelecting(null);
      return;
    }
    setSplices(prev=>{ const next={...prev},od=next[srcKey],os=next[key]; if(od) delete next[od]; if(os) delete next[os]; next[srcKey]=key; next[key]=srcKey; return next; });
    setSelecting(null);
  };

  const removeSplice=(key)=>{ setSplices(prev=>{ const n={...prev},p=n[key]; if(p) delete n[p]; delete n[key]; return n; }); };
  const getSpliceLabel=(ci,fi)=>{ const d=splices[sk(ci,fi)]; if(!d) return null; const [dci,dfi]=d.split(":").map(Number); return `→ C${dci+1} ${getFiber(dfi).label}`; };
  const toggleTube=(ci,ti)=>{ const k=`${ci}-${ti}`; setExpandedTubes(p=>({...p,[k]:p[k]===false?true:false})); };
  const tubeExpanded=(ci,ti)=>expandedTubes[`${ci}-${ti}`]!==false;

  const exportCSV=()=>{
    const rows=[["Cable No","Cable Name","Direction","Size","Location","Node","Buffer Tube No","Buffer Tube Color","Fiber No","Fiber Color","Fiber ID","Spliced To Cable","Spliced To Fiber"]];
    cables.forEach((cab,ci)=>{ getTubes(cab).forEach(({ti,tubeColor,fibers})=>{ fibers.forEach(fi=>{ const fb=getFiber(fi),dest=splices[sk(ci,fi)]; let toName="",toFiber=""; if(dest){ const[dci,dfi]=dest.split(":").map(Number); toName=`C${dci+1} ${cables[dci]?.name||""}`; toFiber=getFiber(dfi).label; } rows.push([ci+1,cab.name,cab.direction,cab.size+"F",cab.location,cab.node,ti+1,tubeColor.name,fi+1,fb.fiberColor.name,fb.label,toName,toFiber]); }); }); });
    const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`splice_matrix_${nodeInfo.node.replace(/\s+/g,"_")}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
    setExportMsg("Exported CSV"); setTimeout(()=>setExportMsg(""),3000);
  };

  const exportDiagramPNG=()=>{
    const svg=diagramRef.current; if(!svg) return;
    const w=Number(svg.getAttribute("width"))||860;
    const h=Number(svg.getAttribute("height"))||766;
    const SCALE=2;
    const clone=svg.cloneNode(true);
    clone.style.background="#ffffff";
    const bg=clone.querySelector("#canvasBg");
    if(bg) bg.setAttribute("fill","#ffffff");
    const svgStr=new XMLSerializer().serializeToString(clone);
    const svgB64="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svgStr)));
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      canvas.width=w*SCALE; canvas.height=h*SCALE;
      const ctx=canvas.getContext("2d");
      ctx.scale(SCALE,SCALE);
      ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url; a.download=`splice_diagram_${nodeInfo.node.replace(/\s+/g,"_")}.png`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      },"image/png");
    };
    img.onerror=()=>{ setExportMsg("Export failed — try again"); setTimeout(()=>setExportMsg(""),3000); };
    img.src=svgB64;
  };

  // ── Save / Load project as JSON file ──
  const saveProject=()=>{
    const data={ v:APP_VERSION, app:"Fiber Splice Matrix", saved:new Date().toISOString(), cables, nodeInfo, splices };
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download=`${(nodeInfo.node||"splice_project").replace(/\s+/g,"_")}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(a.href);
    setExportMsg("Project saved"); setTimeout(()=>setExportMsg(""),3000);
  };
  const openProject=()=>{ fileInputRef.current && fileInputRef.current.click(); };
  const onFileChosen=(e)=>{
    const file=e.target.files && e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try {
        const d=JSON.parse(ev.target.result);
        if(!d.cables||!d.splices){ setExportMsg("Not a valid project file"); setTimeout(()=>setExportMsg(""),3000); return; }
        setCables(d.cables);
        setNodeInfo(d.nodeInfo||{ node:"", address:"", handhole:"", enclosure:"" });
        setSplices(d.splices||{});
        setSelecting(null); setSelectingRange(null);
        setExportMsg("Project loaded"); setTimeout(()=>setExportMsg(""),3000);
      } catch(err){ setExportMsg("Could not read file"); setTimeout(()=>setExportMsg(""),3000); }
    };
    reader.readAsText(file);
    e.target.value="";
  };
  const newProject=()=>{
    setCables([makeCable(1),makeCable(2)]);
    setNodeInfo({ node:"Node 1", address:"", handhole:"", enclosure:"Enclosure #1" });
    setSplices({}); setSelecting(null); setSelectingRange(null); setConfirmDelete(false);
    setExportMsg("New project"); setTimeout(()=>setExportMsg(""),2000);
  };

  const spliceCount=Object.keys(splices).length/2;
  const totalFibers=cables.reduce((s,c)=>s+c.size,0);
  const tabStyle=(t)=>({ fontSize:12,padding:"5px 16px",borderRadius:"6px 6px 0 0",border:`0.5px solid ${T.border}`,borderBottom:t===tab?`0.5px solid ${T.tabActive}`:`0.5px solid ${T.border}`,background:t===tab?T.tabActive:T.tabIdle,color:t===tab?T.text:T.textDim,cursor:"pointer",marginRight:4,marginBottom:-1,position:"relative",zIndex:t===tab?2:1 });
  const toolBtn=(extra)=>({ fontSize:11,padding:"4px 10px",borderRadius:6,border:`0.5px solid ${T.border}`,background:T.btnBg,color:T.text,cursor:"pointer", ...extra });

  return (
    <div style={{fontFamily:"system-ui,sans-serif",padding:"0 0 24px",background:T.appBg,minHeight:"100vh",transition:"background 0.2s"}}>
      <input type="file" ref={fileInputRef} accept="application/json,.json" onChange={onFileChosen} style={{display:"none"}}/>
      <div style={{background:T.banner,padding:"8px 14px",marginBottom:12,display:"flex",alignItems:"center",position:"relative"}}>
        <LeeCountyLogo height={52}/>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:14}}>
          <button onClick={()=>setDark(d=>!d)} title={dark?"Switch to light mode":"Switch to dark mode"}
            style={{display:"flex",alignItems:"center",gap:6,fontSize:11,padding:"4px 12px",borderRadius:20,border:"0.5px solid rgba(255,255,255,0.35)",background:"rgba(255,255,255,0.12)",color:"#fff",cursor:"pointer",fontWeight:500}}>
            {dark?"☀ Light":"☾ Dark"}
          </button>
          <span style={{color:"#9fc4e8",fontSize:13,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase"}}>Splice Matrix</span>
        </div>
      </div>

      <div style={{background:T.panel,borderRadius:10,border:`0.5px solid ${T.border}`,padding:"8px 12px",margin:"0 8px 12px"}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:8,paddingBottom:8,borderBottom:`0.5px solid ${T.borderSoft}`}}>
          <span style={{fontSize:10,color:T.textDim,fontWeight:600,marginRight:2}}>PROJECT:</span>
          <button onClick={newProject} style={toolBtn()}>New</button>
          <button onClick={openProject} style={toolBtn()}>Open…</button>
          <button onClick={saveProject} style={toolBtn({border:`0.5px solid ${T.accentBorder}`,background:T.accentBg,color:T.accentText,fontWeight:500})}>Save Project</button>
          <span style={{fontSize:9,color:T.textFaint,marginLeft:4}}>Auto-saves to this browser · Save Project makes a .json backup</span>
          {exportMsg&&<span style={{marginLeft:"auto",fontSize:11,color:T.spliceText,fontWeight:600}}>{exportMsg}</span>}
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
          {[["Location","node"],["Address","address"],["Hand Hole #","handhole"],["Enclosure","enclosure"]].map(([label,k])=>(
            <div key={k} style={{flex:k==="address"?2:1,minWidth:90}}>
              <div style={{fontSize:9,color:T.textDim,marginBottom:2}}>{label}</div>
              <input value={nodeInfo[k]} onChange={e=>setNodeInfo(n=>({...n,[k]:e.target.value}))}
                style={{width:"100%",fontSize:12,fontWeight:k==="node"?500:400,border:`0.5px solid ${T.border}`,borderRadius:5,padding:"2px 6px",background:T.inputBg,color:T.text}}/>
            </div>
          ))}
          <div style={{display:"flex",flexDirection:"column",gap:4,paddingBottom:1}}>
            <div style={{display:"flex",gap:6}}>
              <button onClick={addCable} disabled={cables.length>=MAX_CABLES} style={{fontSize:11,padding:"4px 10px",borderRadius:6,border:`0.5px solid ${T.border}`,background:T.btnBg,color:cables.length>=MAX_CABLES?T.textFaint:T.text,cursor:cables.length>=MAX_CABLES?"not-allowed":"pointer"}}>+ Cable</button>
              <button onClick={exportCSV} style={{fontSize:11,padding:"4px 10px",borderRadius:6,border:`0.5px solid ${T.accentBorder}`,background:T.accentBg,color:T.accentText,cursor:"pointer",fontWeight:500}}>↓ Export Excel</button>
            </div>
            {!confirmDelete
              ? <button onClick={()=>{ if(Object.keys(splices).length>0) setConfirmDelete(true); }} disabled={Object.keys(splices).length===0}
                  style={{fontSize:11,padding:"4px 10px",borderRadius:6,border:`0.5px solid ${T.dangerBorder}`,background:T.dangerBg,color:Object.keys(splices).length===0?T.textFaint:T.dangerText,cursor:Object.keys(splices).length===0?"not-allowed":"pointer",fontWeight:500}}>
                  🗑 Delete All Splices
                </button>
              : <div style={{display:"flex",gap:4,alignItems:"center"}}>
                  <span style={{fontSize:10,color:T.dangerText,fontWeight:500}}>Sure?</span>
                  <button onClick={()=>{ setSplices({}); setConfirmDelete(false); }} style={{fontSize:11,padding:"3px 8px",borderRadius:6,border:"0.5px solid #c0392b",background:"#c0392b",color:"#fff",cursor:"pointer",fontWeight:600}}>Yes, delete</button>
                  <button onClick={()=>setConfirmDelete(false)} style={{fontSize:11,padding:"3px 8px",borderRadius:6,border:`0.5px solid ${T.border}`,background:T.btnBg,color:T.text,cursor:"pointer"}}>Cancel</button>
                </div>
            }
          </div>
        </div>
        <div style={{display:"flex",gap:14,marginTop:6,fontSize:10,color:T.textDim,flexWrap:"wrap"}}>
          <span>Cables: <b style={{color:T.text}}>{cables.length}/{MAX_CABLES}</b></span>
          <span>Total fibers: <b style={{color:T.text}}>{totalFibers}</b></span>
          <span>Fusion splices: <b style={{color:T.text}}>{spliceCount}</b></span>
          {selecting&&<span style={{color:DC.East,fontWeight:500}}>⬡ Source: C{selecting.ci+1} {getFiber(selecting.fi).label} — click another fiber on same cable to select a range, or click destination
            <button onClick={()=>setSelecting(null)} style={{marginLeft:8,fontSize:10,padding:"1px 6px",borderRadius:4,border:`0.5px solid ${T.border}`,background:T.btnBg,cursor:"pointer",color:T.text}}>Cancel</button>
          </span>}
          {selectingRange&&<span style={{color:DC.South,fontWeight:500}}>⬡ Range: C{selectingRange.ci+1} · {selectingRange.fibers.length} fibers selected — click destination start fiber on another cable
            <button onClick={()=>setSelectingRange(null)} style={{marginLeft:8,fontSize:10,padding:"1px 6px",borderRadius:4,border:`0.5px solid ${T.border}`,background:T.btnBg,cursor:"pointer",color:T.text}}>Cancel</button>
          </span>}
        </div>
      </div>

      <div style={{display:"flex",borderBottom:`0.5px solid ${T.border}`,marginBottom:12,position:"sticky",top:0,zIndex:10,background:T.appBg,paddingTop:4,paddingLeft:8}}>
        <button style={tabStyle("matrix")} onClick={()=>setTab("matrix")}>↔ Matrix</button>
        <button style={tabStyle("diagram")} onClick={()=>setTab("diagram")}>Splice Diagram</button>
      </div>

      {tab==="matrix"&&(
        <div style={{padding:"0 8px"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
            {cables.map((cab,ci)=>{
              const tubes=getTubes(cab), dirColor=DC[cab.direction]||DC.North;
              return(
                <div key={ci} style={{border:`0.5px solid ${T.border}`,borderRadius:10,background:T.panel,overflow:"hidden"}}>
                  <div style={{background:T.panelAlt,padding:"6px 10px",borderBottom:`0.5px solid ${T.borderSoft}`,display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                    <span style={{background:dirColor,color:dark?"#0f172a":"#fff",borderRadius:5,fontSize:10,fontWeight:600,padding:"1px 7px",flexShrink:0}}>C{ci+1}</span>
                    <input value={cab.name} onChange={e=>updateCable(ci,{name:e.target.value})} placeholder="Cable name" style={{flex:1,minWidth:60,fontSize:12,fontWeight:500,border:"none",background:"transparent",color:T.text}}/>
                    <select value={cab.direction} onChange={e=>updateCable(ci,{direction:e.target.value})} style={{fontSize:10,padding:"0 2px",height:20,border:`0.5px solid ${dirColor}`,borderRadius:4,background:T.inputBg,color:dirColor,fontWeight:600}}>
                      {DIRECTIONS.map(d=><option key={d} style={{background:T.inputBg,color:T.text}}>{d}</option>)}
                    </select>
                    <select value={cab.size} onChange={e=>updateCable(ci,{size:Number(e.target.value)})} style={{fontSize:10,padding:"0 2px",height:20,width:42,border:`0.5px solid ${T.border}`,borderRadius:4,background:T.inputBg,color:T.text}}>
                      {CABLE_SIZES.map(s=><option key={s} value={s} style={{background:T.inputBg,color:T.text}}>{s}F</option>)}
                    </select>
                    <button onClick={()=>removeCable(ci)} style={{background:"transparent",border:"none",cursor:"pointer",color:T.dangerText,fontSize:15,padding:"0 2px",lineHeight:1}}>×</button>
                  </div>
                  <div style={{display:"flex",gap:4,padding:"4px 8px",borderBottom:`0.5px solid ${T.borderSoft}`}}>
                    <input value={cab.location} onChange={e=>updateCable(ci,{location:e.target.value})} placeholder="Route / address" style={{flex:1,fontSize:10,border:`0.5px solid ${T.borderSoft}`,borderRadius:4,padding:"2px 5px",background:T.panelAlt,color:T.text}}/>
                    <input value={cab.node} onChange={e=>updateCable(ci,{node:e.target.value})} placeholder="Location" style={{width:80,fontSize:10,border:`0.5px solid ${T.borderSoft}`,borderRadius:4,padding:"2px 5px",background:T.panelAlt,color:T.text}}/>
                  </div>
                  <div style={{padding:"4px 6px 6px",overflowY:"auto",maxHeight:400}}>
                    {tubes.map(({ti,tubeColor,fibers})=>(
                      <div key={ti} style={{marginBottom:3}}>
                        <div onClick={()=>toggleTube(ci,ti)} style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",padding:"2px 4px",borderRadius:5,background:T.panelAlt,marginBottom:2,userSelect:"none"}}>
                          <ColorDot color={tubeColor} size={10}/>
                          <span style={{fontSize:10,fontWeight:500,color:T.text}}>Buffer Tube {ti+1} — {tubeColor.name}</span>
                          <span style={{fontSize:9,color:T.textDim,marginLeft:"auto"}}>{fibers.length}F {tubeExpanded(ci,ti)?"▾":"▸"}</span>
                        </div>
                        {tubeExpanded(ci,ti)&&fibers.map(fi=>{
                          const fb=getFiber(fi),key=sk(ci,fi),spliced=!!splices[key];
                          const srcSel=selecting?.ci===ci&&selecting?.fi===fi;
                          const inRange=selectingRange?.ci===ci&&selectingRange.fibers.includes(fi);
                          const isRangeDest=!!selectingRange&&selectingRange.ci!==ci;
                          const isCandidate=!!selecting&&!srcSel&&selecting.ci!==ci;
                          const isSameCableCandidate=!!selecting&&!srcSel&&selecting.ci===ci;
                          let bg="transparent", border="0.5px solid transparent", hint="";
                          if(srcSel){        bg=T.srcBg;    border=`0.5px solid ${T.srcBorder}`; }
                          else if(inRange){  bg=T.rangeBg;  border=`0.5px solid ${T.rangeBorder}`; }
                          else if(spliced){  bg=T.spliceBg; border=`0.5px solid ${T.spliceBorder}`; }
                          else if(isRangeDest){ bg=T.accentBg; }
                          else if(isCandidate){ bg=T.accentBg; }
                          if(spliced) hint=getSpliceLabel(ci,fi);
                          else if(inRange) hint="in range";
                          else if(isRangeDest) hint="tap to start range splice";
                          else if(isCandidate) hint="tap to splice";
                          else if(isSameCableCandidate) hint="tap to set range end";
                          return(
                            <div key={fi} onClick={()=>handleFiberClick(ci,fi)} style={{display:"flex",alignItems:"center",gap:5,padding:"2px 6px",borderRadius:4,marginBottom:1,cursor:"pointer",background:bg,border}}>
                              <ColorDot color={tubeColor} size={8}/>
                              <ColorDot color={fb.fiberColor} size={8}/>
                              <span style={{fontSize:10,color:T.textDim,width:16,textAlign:"right",flexShrink:0}}>{fi+1}</span>
                              <span style={{fontSize:10,color:T.text,width:40,flexShrink:0}}>{fb.fiberColor.name}</span>
                              <span style={{fontSize:9,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:spliced?T.spliceText:inRange?T.rangeBorder:T.textFaint}}>{hint}</span>
                              {spliced&&<span onClick={e=>{e.stopPropagation();removeSplice(key);}} style={{fontSize:12,color:T.dangerText,cursor:"pointer",lineHeight:1,flexShrink:0}}>×</span>}
                            </div>
                          );
                        })}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
            {cables.length===0&&<div style={{gridColumn:"1/-1",textAlign:"center",padding:"40px 0",color:T.textFaint,fontSize:13}}>No cables. Click "+ Cable" to begin.</div>}
          </div>

          {spliceCount>0&&(
            <div style={{marginTop:14,border:`0.5px solid ${T.border}`,borderRadius:10,overflow:"hidden",background:T.panel}}>
              <div style={{background:T.panelAlt,padding:"6px 12px",fontSize:11,fontWeight:500,color:T.text,borderBottom:`0.5px solid ${T.borderSoft}`}}>
                Fusion splice schedule — {spliceCount} splice{spliceCount!==1?"s":""}
              </div>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:10}}>
                  <thead><tr style={{color:T.textDim}}>
                    {["#","Cable A","Dir","Buffer Tube A","Fiber A","Cable B","Dir","Buffer Tube B","Fiber B",""].map((h,i)=>(
                      <th key={i} style={{textAlign:"left",padding:"4px 8px",fontWeight:400,borderBottom:`0.5px solid ${T.borderSoft}`}}>{h}</th>
                    ))}
                  </tr></thead>
                  <tbody>{(()=>{
                    const seen=new Set(),rows=[];let n=0;
                    for(const[k,v] of Object.entries(splices)){
                      if(seen.has(k)||seen.has(v)) continue; seen.add(k);seen.add(v);
                      const[aci,afi]=k.split(":").map(Number),[bci,bfi]=v.split(":").map(Number);
                      const afb=getFiber(afi),bfb=getFiber(bfi),cabA=cables[aci],cabB=cables[bci];
                      if(!cabA||!cabB) continue; n++;
                      rows.push(<tr key={k} style={{borderTop:`0.5px solid ${T.borderSoft}`,color:T.text}}>
                        <td style={{padding:"3px 8px",color:T.textDim}}>{n}</td>
                        <td style={{padding:"3px 8px"}}><b>C{aci+1}</b> {cabA.name}</td>
                        <td style={{padding:"3px 8px"}}><span style={{color:DC[cabA.direction],fontWeight:600,fontSize:10}}>{cabA.direction}</span></td>
                        <td style={{padding:"3px 8px"}}><span style={{display:"inline-flex",alignItems:"center",gap:4}}><ColorDot color={afb.tubeColor} size={8}/>{afb.tubeColor.name}</span></td>
                        <td style={{padding:"3px 8px"}}><span style={{display:"inline-flex",alignItems:"center",gap:4}}><ColorDot color={afb.fiberColor} size={8}/>{afb.fiberColor.name} (F{afi+1})</span></td>
                        <td style={{padding:"3px 8px"}}><b>C{bci+1}</b> {cabB.name}</td>
                        <td style={{padding:"3px 8px"}}><span style={{color:DC[cabB.direction],fontWeight:600,fontSize:10}}>{cabB.direction}</span></td>
                        <td style={{padding:"3px 8px"}}><span style={{display:"inline-flex",alignItems:"center",gap:4}}><ColorDot color={bfb.tubeColor} size={8}/>{bfb.tubeColor.name}</span></td>
                        <td style={{padding:"3px 8px"}}><span style={{display:"inline-flex",alignItems:"center",gap:4}}><ColorDot color={bfb.fiberColor} size={8}/>{bfb.fiberColor.name} (F{bfi+1})</span></td>
                        <td style={{padding:"3px 8px"}}><span onClick={()=>removeSplice(k)} style={{cursor:"pointer",color:T.dangerText,fontSize:12}}>×</span></td>
                      </tr>);
                    }
                    return rows;
                  })()}</tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      )}

      {tab==="diagram"&&(
        <div style={{border:`0.5px solid ${T.border}`,borderRadius:10,overflow:"hidden",background:T.panel,margin:"0 8px"}}>
          <div style={{background:T.panelAlt,padding:"6px 12px",fontSize:11,fontWeight:500,color:T.text,borderBottom:`0.5px solid ${T.borderSoft}`,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span>{nodeInfo.node} — {nodeInfo.enclosure} — Splice diagram</span>
            <button onClick={exportDiagramPNG} style={{fontSize:11,padding:"3px 10px",borderRadius:6,border:`0.5px solid ${T.accentBorder}`,background:T.accentBg,color:T.accentText,cursor:"pointer",fontWeight:500}}>↓ Export PNG</button>
          </div>
          <div style={{padding:8}}>
            <DiagramTab cables={cables} splices={splices} nodeInfo={nodeInfo} diagramRef={diagramRef} T={T}/>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
  // Register the service worker so the app works offline after first load.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW registration failed:", err));
    });
  }
</script>
</body>
</html>
